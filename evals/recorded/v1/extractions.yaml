documents:
  - document_id: reg-23183-2026-05
    variables:
      - name: Valor da Cota para Aplicação
        value: D+0
        evidence: Valor da Cota para Aplicação D+0
        pages: [6]
      - name: Carência Para Resgate
        value: A qualquer tempo com rendimento
        evidence: As cotas da classe podem ser resgatadas a qualquer tempo com rendimento.
        pages: [6]
      - name: Conversão do resgate
        value: D+0 a partir da solicitação
        evidence: "Conversão: D+0 a partir da solicitação (“Data da Conversão”)."
        pages: [6]
      - name: Pagamento do resgate
        value: D+1 Útil da Data da Conversão
        evidence: "Pagamento: D+1 Útil da Data da Conversão."
        pages: [6]
      - name: Pagamento no mesmo dia
        value: D+0 para resgate inferior a 80% dos recursos do cotista
        evidence: Caso o total de resgates solicitados pelo Cotista seja inferior a 80% (oitenta por cento) dos recursos detidos pelo mesmo, o pagamento do resgate será efetuado no dia da solicitação respectiva (D+0)
        pages: [6]
  - document_id: reg-23968-2026-05
    variables:
      - name: Disponibilidade de resgate
        value: Somente no término do prazo de duração ou na amortização total
        evidence: Não haverá resgate de cotas a não ser pelo término do prazo de duração ou amortização total da classe e/ou subclasse de cotas, conforme aplicável.
        pages: [7]
      - name: Distribuição de cotas de classe fechada
        value: Deve observar a regulamentação de ofertas públicas de valores mobiliários
        evidence: A distribuição de cotas de classe fechada deve observar a regulamentação específica sobre ofertas públicas de distribuição de valores mobiliários.
        pages: [7]
      - name: Nova distribuição de cotas
        value: Não admitida antes do encerramento da distribuição anterior
        evidence: Não é admitida nova distribuição de cotas de classe fechada antes de encerrada a distribuição anterior de cotas da mesma classe ou subclasse.
        pages: [7]
      - name: Condições de emissão e integralização
        value: Definidas no documento de aceitação da oferta conforme a Assembleia de Cotistas
        evidence: O valor de cada emissão de cotas e as condições de integralização seguirão o disposto no documento de aceitação da oferta de cotas da classe fechada
        pages: [7]
      - name: Forma de amortização
        value: Proporcional entre principal e rendimentos mediante aprovação em assembleia
        evidence: A amortização de cotas será sempre efetuada de forma proporcional entre principal e rendimentos, mediante aprovação em assembleia de cotistas.
        pages: [7]
      - name: Abrangência da amortização
        value: Todas as cotas com pagamento uniforme e sem redução do número de cotas
        evidence: A amortização de cotas abrangerá todas as cotas, sendo caracterizada pelo pagamento uniforme a todos os cotistas
        pages: [7]
      - name: Liquidação antecipada
        value: Divisão proporcional do patrimônio em até 30 dias após a assembleia
        evidence: na proporção de suas cotas, no prazo máximo de 30 (trinta) dias, a contar da data de realização da referida assembleia.
        pages: [7]
